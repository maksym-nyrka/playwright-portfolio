# Front controller for the Toolshop API.
#
# PHP's built-in server (php -S / artisan serve) answers the UI's QUERY
# requests with 501, so requests are handed to php-fpm through nginx instead.
# Everything is routed to public/index.php and nginx forwards the original
# method, headers and body (including QUERY payloads).
server {
    listen 8091;
    server_name _;

    root /var/www/public;
    index index.php;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param HTTP_HOST $host;
        fastcgi_pass laravel-api:9000;
        fastcgi_read_timeout 120s;
    }
}
