services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  laravel-api:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-api
    ports:
      - "8091:8091"
    command: php artisan serve --host=0.0.0.0 --port=8091
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_CLI_SERVER_WORKERS: "4"
      DB_PORT: "3306"
      DB_HOST: mariadb
      host: localhost
      DISABLE_LOGGING: "true"
    depends_on:
      mariadb:
        condition: service_healthy

  angular-ui:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-ui
    ports:
      - "4200:4200"
    command: >
      bash -c "ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - laravel-api
