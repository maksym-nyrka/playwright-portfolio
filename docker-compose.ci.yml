services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # php-fpm is the API image's native runtime; it accepts any HTTP method,
  # including the QUERY requests the current UI sends.
  laravel-api:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-api:${TOOLSHOP_VERSION:-latest}
    command: >
      sh -c "sed -i 's/^DB_HOST=.*/DB_HOST=mariadb/' /var/www/.env &&
             sed -i 's/^DB_PORT=.*/DB_PORT=3306/' /var/www/.env &&
             exec php-fpm"
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      DB_PORT: "3306"
      DB_HOST: mariadb
      host: localhost
      APP_DEBUG: "true"
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      CACHE_DRIVER: file
      SESSION_DRIVER: file
    depends_on:
      mariadb:
        condition: service_healthy

  # Public entry point for the API. PHP's built-in server cannot route QUERY,
  # so nginx proxies to php-fpm. See docker/nginx.conf.
  web:
    image: nginx:alpine
    ports:
      - "8091:8091"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-ui:${TOOLSHOP_VERSION:-latest}
    ports:
      - "4200:4200"
    command: >
      bash -c "ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - web
